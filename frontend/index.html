<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Basic SEO -->
    <title>GROCERA – Online Grocery & Food Shop in Bangladesh</title>

    <meta
      name="description"
      content="Shop fresh groceries, food, beverages, snacks, cooking essentials, and daily household products at GROCERA. Fast delivery across Bangladesh."
    />

    <meta
      name="keywords"
      content="grocera, grocera bd, online grocery bangladesh, grocery shop bd, fresh vegetables, fresh fruits, daily essentials, food products, beverages, snacks, cooking essentials, online supermarket"
    />

    <meta name="author" content="GROCERA" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#2E7D32" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Canonical -->
    <link rel="canonical" href="https://grocera.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GROCERA" />
    <meta property="og:locale" content="en_BD" />
    <meta property="og:url" content="https://grocera.com/" />

    <meta
      property="og:title"
      content="GROCERA – Online Grocery & Food Shop in Bangladesh"
    />

    <meta
      property="og:description"
      content="Shop fresh groceries, food, beverages, snacks, and daily essentials at GROCERA with fast delivery across Bangladesh."
    />

    <meta property="og:image" content="https://grocera.com/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="GROCERA – Online Grocery & Food Shop in Bangladesh"
    />

    <meta
      name="twitter:description"
      content="Buy fresh groceries, food, beverages, snacks, and daily essentials online from GROCERA with fast delivery across Bangladesh."
    />

    <meta name="twitter:image" content="https://grocera.com/og-image.jpg" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload Critical Assets -->
    <link rel="preload" href="/logo.png" as="image" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "GROCERA",
        "url": "https://grocera.com/",
        "logo": "https://grocera.com/logo.png",
        "image": "https://grocera.com/og-image.jpg",
        "description": "GROCERA is an online grocery and food store in Bangladesh offering fresh groceries, fruits, vegetables, beverages, snacks, and daily essentials."
      }
    </script>

    <!-- Loading Screen -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #fff;
      }

      #root {
        min-height: 100vh;
      }

      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #root:empty::after {
        content: "";
        width: 40px;
        height: 40px;
        border: 3px solid #e5e5e5;
        border-top: 3px solid #2e7d32;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
